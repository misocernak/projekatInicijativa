name: Scaffold backend (jednokratno)

# Pravi Laravel 12 skelet u backend/ i commit-uje ga u main.
# Idempotentno: ako backend/artisan već postoji, ne radi ništa.
# Fajl se može obrisati nakon što skelet uđe u repo.

on:
  push:
    paths:
      - '.github/workflows/scaffold-backend.yml'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preskoči ako skelet već postoji
        id: check
        run: |
          if [ -f backend/artisan ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.exists == 'false'
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, xml, curl, zip, fileinfo, openssl
          tools: composer:v2

      - name: Napravi Laravel 12 projekat i API podršku (Sanctum)
        if: steps.check.outputs.exists == 'false'
        run: |
          composer create-project laravel/laravel:^12.0 /tmp/app --no-interaction --prefer-dist
          cd /tmp/app
          php artisan install:api --no-interaction
          # API-only: bez front alata skeleta
          rm -rf package.json vite.config.js resources/js resources/css node_modules vendor .env database/database.sqlite README.md
          # lokalizacija
          sed -i "s/'locale' => env('APP_LOCALE', 'en')/'locale' => env('APP_LOCALE', 'sr')/" config/app.php

      - name: Kopiraj u backend/ i commit
        if: steps.check.outputs.exists == 'false'
        run: |
          rsync -a --exclude 'README.md' /tmp/app/ backend/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Laravel 12 skelet u backend/ (API + Sanctum), generisan u Actions"
          git push
