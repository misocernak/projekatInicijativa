name: Deploy na lepsasrbija.com

# Front (Vite) se gradi u GitHub Actions i šalje preko SSH-a (rsync) u public_html.
# Potrebni Secrets: SSH_PRIVATE_KEY, SSH_HOST, SSH_PORT, SSH_USER

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Otisak SSH ključa servera (ED25519). Ako se ne poklopi, deploy staje.
  HOST_KEY_FINGERPRINT: SHA256:f6IUZWAq9cQPXDFnlGqrXLea9QX61chQ9IW8M6nrWcE

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SSH ključ i provera servera
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for v in SSH_PRIVATE_KEY SSH_HOST SSH_PORT SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Secret $v je prazan ili ne postoji."; exit 1; }
          done
          install -m 700 -d ~/.ssh
          # uklanja Windows prelome redova i razmake sa ivica, uz obavezan završni novi red
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          pub=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>&1) \
            || { echo "::error::Privatni ključ u SSH_PRIVATE_KEY nije ispravan: ${pub//$'\n'/ | }"; exit 1; }
          echo "::notice::Ključ iz Secret-a (otisak): $(echo "$pub" | ssh-keygen -lf - | cut -d' ' -f2)"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -q "$HOST_KEY_FINGERPRINT" \
            || { echo "::error::Otisak servera se ne poklapa ili server nije dostupan, prekidam."; exit 1; }
          out=$(ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'echo ok' 2>&1) \
            || { echo "::error::SSH prijava nije uspela: ${out//$'\n'/ | }"; exit 1; }
          echo "::notice::SSH prijava radi."

      - name: Upload fronta u public_html
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # --delete uklanja stare fajlove (npr. parking stranicu), a izuzeci ostaju netaknuti:
          #   .well-known = SSL provera, cgi-bin = cPanel, api = Laravel ulaz, uploads = slike korisnika
          rsync -az --delete \
            --exclude '.well-known' --exclude 'cgi-bin' --exclude 'api' --exclude 'uploads' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:public_html/"
